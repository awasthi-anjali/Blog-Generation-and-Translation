<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agentic Blog Generator</title>
  <style>
    :root {
      --bg: #eef2ff;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --ring: rgba(79, 70, 229, 0.2);
      --border: #e2e8f0;
      --success: #166534;
      --error: #b91c1c;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at top right, #e0e7ff, var(--bg));
      color: var(--text);
    }
    .container {
      max-width: 860px;
      margin: 36px auto;
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: 0.2px;
    }
    .hint {
      color: var(--muted);
      margin: 0 0 24px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }
    label {
      font-weight: 700;
      color: #1e293b;
    }
    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--ring);
    }
    .row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 14px;
    }
    @media (max-width: 760px) {
      .row {
        grid-template-columns: 1fr;
      }
    }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.08s ease;
    }
    button:hover:enabled {
      background: var(--primary-hover);
    }
    button:active:enabled {
      transform: translateY(1px);
    }
    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .secondary-btn {
      background: #334155;
    }
    .secondary-btn:hover:enabled {
      background: #1e293b;
    }
    .status {
      margin-top: 16px;
      min-height: 22px;
      font-weight: 600;
      color: var(--muted);
    }
    .status.success {
      color: var(--success);
    }
    .status.error {
      color: var(--error);
    }
    .result {
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }
    .history {
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }
    .history h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }
    .history-list {
      display: grid;
      gap: 12px;
    }
    .history-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      background: #fafcff;
    }
    .history-meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .history-topic {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #0f172a;
    }
    .history-title {
      font-size: 13px;
      color: #334155;
      line-height: 1.45;
    }
    .history-actions {
      margin-top: 10px;
      display: flex;
      justify-content: flex-end;
    }
    .danger-btn {
      background: #dc2626;
      padding: 8px 12px;
      font-size: 13px;
      border-radius: 8px;
    }
    .danger-btn:hover:enabled {
      background: #b91c1c;
    }
    .title {
      font-size: 20px;
      margin-bottom: 10px;
      color: #111827;
      font-weight: 700;
    }
    #blogContent {
      color: #1f2937;
      line-height: 1.6;
      font-size: 14px;
    }
    #blogContent h1, #blogContent h2, #blogContent h3 {
      color: #0f172a;
      margin-top: 1.2em;
      margin-bottom: 0.45em;
      line-height: 1.3;
      font-weight: 700;
    }
    #blogContent h1 {
      font-size: 1.35rem;
    }
    #blogContent h2 {
      font-size: 1.2rem;
    }
    #blogContent h3 {
      font-size: 1.05rem;
    }
    #blogContent p {
      margin: 0.8em 0;
    }
    #blogContent ul, #blogContent ol {
      margin: 0.8em 0 0.8em 1.2em;
    }
    #blogContent code {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 2px 6px;
      font-family: Consolas, monospace;
      font-size: 0.92em;
    }
    #blogContent blockquote {
      border-left: 4px solid #c7d2fe;
      margin: 1em 0;
      padding: 0.4em 1em;
      color: #334155;
      background: #f8faff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Agentic Blog Generator</h1>
    <p class="hint">Write your topic and choose language. Markdown from backend now renders with proper bold text and formatting.</p>

    <form id="blogForm">
      <div class="row">
        <div class="field">
          <label for="topic">Topic</label>
          <input id="topic" type="text" placeholder="e.g. Future of AI in Healthcare" required />
        </div>

        <div class="field">
          <label for="language">Language (optional)</label>
          <select id="language">
            <option value="">English (default)</option>
            <option value="hindi">Hindi</option>
            <option value="french">French</option>
          </select>
        </div>
      </div>

      <div class="button-row">
        <button id="submitBtn" type="submit">Generate Blog</button>
        <button id="historyBtn" class="secondary-btn" type="button">Check History</button>
      </div>
    </form>

    <div class="status" id="status"></div>
    <div class="result" id="result" hidden>
      <div class="title" id="blogTitle"></div>
      <div id="blogContent"></div>
    </div>

    <div class="history" id="historySection" hidden>
      <h2>Blog History</h2>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const form = document.getElementById("blogForm");
    const topicInput = document.getElementById("topic");
    const languageSelect = document.getElementById("language");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");
    const historyBtn = document.getElementById("historyBtn");
    const resultBox = document.getElementById("result");
    const blogTitleEl = document.getElementById("blogTitle");
    const blogContentEl = document.getElementById("blogContent");
    const historySection = document.getElementById("historySection");
    const historyList = document.getElementById("historyList");
    const historyCache = new Map();
    
    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = "status" + (type ? " " + type : "");
    }

    function renderMarkdown(markdownText) {
      if (!markdownText) return "";
      return marked.parse(markdownText, { breaks: true });
    }

    function escapeHtml(text) {
      return (text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    async function loadHistory() {
      historyBtn.disabled = true;
      setStatus("Loading blog history...");
      try {
        const response = await fetch("/blogs/history?limit=10");
        if (!response.ok) {
          throw new Error("Backend returned " + response.status);
        }
        const body = await response.json();
        const items = body?.data || [];
        historyCache.clear();
        items.forEach((item) => {
          historyCache.set(Number(item.id), item);
        });

        if (!items.length) {
          historyList.innerHTML = "<div class='history-item'>No history found yet.</div>";
        } else {
          historyList.innerHTML = items.map((item) => {
            const createdAt = item.created_at ? new Date(item.created_at + "Z").toLocaleString() : "";
            return `
              <div class="history-item">
                <div class="history-meta">${escapeHtml(createdAt)} | Language: ${escapeHtml(item.language || "english")}</div>
                <div class="history-topic">Topic: ${escapeHtml(item.topic || "")}</div>
                <div class="history-title"><strong>Title:</strong> ${escapeHtml(item.title || "Untitled Blog")}</div>
                <div class="history-actions">
                  <button class="secondary-btn" type="button" data-action="view" data-id="${item.id}">View</button>
                  <button class="danger-btn" type="button" data-id="${item.id}">Delete</button>
                </div>
              </div>
            `;
          }).join("");
        }

        resultBox.hidden = true;
        historySection.hidden = false;
        historyBtn.textContent = "Hide History";
        setStatus("History loaded successfully.", "success");
      } catch (error) {
        setStatus("Failed to load history: " + error.message, "error");
      } finally {
        historyBtn.disabled = false;
      }
    }

    async function deleteHistoryItem(blogId) {
      if (!blogId) return;
      const shouldDelete = window.confirm("Delete this blog from history?");
      if (!shouldDelete) return;

      setStatus("Deleting blog...");
      try {
        const response = await fetch(`/blogs/${blogId}`, { method: "DELETE" });
        if (!response.ok) {
          throw new Error("Backend returned " + response.status);
        }
        setStatus("Blog deleted successfully.", "success");
        await loadHistory();
      } catch (error) {
        setStatus("Failed to delete blog: " + error.message, "error");
      }
    }

    historyList.addEventListener("click", async (event) => {
      const actionBtn = event.target.closest("button[data-id]");
      if (!actionBtn) return;
      const blogId = Number(actionBtn.getAttribute("data-id"));
      const action = actionBtn.getAttribute("data-action");

      if (action === "view") {
        const item = historyCache.get(blogId);
        if (!item) {
          setStatus("Blog details not found. Reload history.", "error");
          return;
        }
        blogTitleEl.innerHTML = renderMarkdown(item.title || "Untitled Blog");
        blogContentEl.innerHTML = renderMarkdown(item.content || "");
        resultBox.hidden = false;
        historySection.hidden = true;
        historyBtn.textContent = "Check History";
        setStatus("Showing selected blog from history.", "success");
        return;
      }

      await deleteHistoryItem(blogId);
    });

    historyBtn.addEventListener("click", async () => {
      if (!historySection.hidden) {
        historySection.hidden = true;
        historyBtn.textContent = "Check History";
        setStatus("History hidden.");
        return;
      }
      await loadHistory();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const topic = topicInput.value.trim();
      const language = languageSelect.value;

      if (!topic) {
        setStatus("Please enter a topic.", "error");
        return;
      }

      const payload = { topic };
      if (language) {
        payload.language = language;
      }

      setStatus("Generating blog...");
      submitBtn.disabled = true;
      resultBox.hidden = true;
      historySection.hidden = true;
      historyBtn.textContent = "Check History";

      try {
        const response = await fetch("/blogs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error("Backend returned " + response.status);
        }

        const body = await response.json();
        const blog = body?.data?.blog;

        if (!blog) {
          throw new Error("Invalid response format");
        }

        const renderedTitle = renderMarkdown(blog.title || "Untitled Blog");
        blogTitleEl.innerHTML = renderedTitle;
        blogContentEl.innerHTML = renderMarkdown(blog.content || "");
        resultBox.hidden = false;
        setStatus("Blog generated successfully.", "success");
      } catch (error) {
        setStatus("Failed to generate blog: " + error.message, "error");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
